name = "aidevhub-api"
main = "src/workers/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "aidevhub-db"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "aidevhub-assets"

[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_ID"

[vars]
NEXT_PUBLIC_SITE_URL = "https://aidevhub.net"
